---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - lp
  - name: wheel
    must_exist: true
    system: true
  - network
  - audio
  - storage
  - video
  - input
autologinGroup: autologin
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doAutologin: false
allowWeakPasswords: false
allowWeakPasswordsDefault: false
passwordRequirements:
  minLength: 8
  maxLength: 128
  libpwquality:
    - minlen=8
    - maxrepeat=3
    - maxsequence=3
user:
  shell: /bin/bash
  forbidden_names: [ root, liveuser ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "lokro-${login}"
  forbidden_names: [ localhost, archiso ]
