---
modules-search: [ local ]

instances:
  - id: desktop
    module: packagechooser
    config: packagechooser-desktop.conf
  - id: apps
    module: packagechooser
    config: packagechooser-apps.conf
  - id: browser
    module: packagechooser
    config: packagechooser-browser.conf
  - id: graphics
    module: packagechooser
    config: packagechooser.conf
  - id: gaming
    module: packagechooser
    config: packagechooser-gaming.conf
  - id: cleanup
    module: shellprocess
    config: shellprocess-cleanup.conf
  - id: browserCleanup
    module: contextualprocess
    config: contextualprocess-browser.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - packagechooser@desktop
      - packagechooser@apps
      - packagechooser@browser
      - packagechooser@graphics
      - packagechooser@gaming
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - packages
      - contextualprocess@browserCleanup
      - luksbootkeyfile
      - fstab
      - shellprocess@cleanup
      - initcpiocfg
      - initcpio
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: lokro
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
