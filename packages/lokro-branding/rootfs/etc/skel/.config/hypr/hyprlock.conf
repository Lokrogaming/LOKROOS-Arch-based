general {
    hide_cursor = true
    grace = 1
}

background {
    monitor =
    color = rgba(070708ff)
}

label {
    monitor =
    text = $TIME
    color = rgba(f4f4f5ff)
    font_size = 64
    font_family = Noto Sans
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = LOKRO OS
    color = rgba(a1a1aaff)
    font_size = 18
    font_family = Noto Sans
    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    outer_color = rgba(52525bff)
    inner_color = rgba(151518ee)
    font_color = rgba(f4f4f5ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##a1a1aa">Passwort</span>
    fail_text = <span foreground="##fca5a5">$FAIL</span>
    position = 0, -30
    halign = center
    valign = center
}
