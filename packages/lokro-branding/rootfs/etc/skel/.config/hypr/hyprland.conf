# LOKRO's optional keyboard-focused Wayland session. Plasma remains the default.

$mod = SUPER
$terminal = konsole
$fileManager = dolphin
$menu = wofi --show drun --allow-images

monitor = ,preferred,auto,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland

exec-once = waybar
exec-once = /usr/bin/lokro-first-login
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

input {
    kb_layout = de,us
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(f4f4f5ff)
    col.inactive_border = rgba(3f3f4666)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.96
    blur {
        enabled = false
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000088)
    }
}

animations {
    enabled = true
    bezier = lokro, 0.22, 1, 0.36, 1
    animation = windows, 1, 4, lokro
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, lokro
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

bind = $mod, Return, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod, Space, exec, $menu
bind = $mod, R, exec, lokro-search
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod SHIFT, Space, togglefloating
bind = $mod, L, exec, hyprlock
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
