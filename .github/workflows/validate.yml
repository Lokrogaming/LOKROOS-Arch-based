name: Validate

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes desktop-file-utils shellcheck python3-yaml
      - name: Static repository validation
        run: make validate
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  resolve-arch-packages:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    steps:
      - uses: actions/checkout@v7
      - name: Resolve repository package graph
        run: |
          pacman -Syu --noconfirm --needed bash make pacman
          make check-repos
